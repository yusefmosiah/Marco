[project]
name = "emf"
version = "0.1.0"
description = "Emerging Markets Financials macro and filing normalization lab"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15.0",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
xgboost = ["xgboost>=3.0"]

[project.scripts]
emf-macro = "emf_macro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emf_macro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
